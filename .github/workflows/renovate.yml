name: Renovate
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Nur dieses Repository verarbeiten (owner/repo); leer = Autodiscovery'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '30 15 * * *'
      timezone: 'Europe/Berlin'
    - cron: '45 18 * * *'
      timezone: 'Europe/Berlin'
  pull_request:

jobs:
  renovate:
    name: Renovate (${{ matrix.owner }})
    strategy:
      fail-fast: false
      matrix:
        # Pro Owner wird ein eigenes Installation-Token der GitHub App geholt.
        # Ein Token gilt immer nur fuer eine Installation (einen Owner).
        owner:
          - sidey79
          - antannah
    env:
      RENOVATE_LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    # Pro Owner hoechstens ein Lauf gleichzeitig (Cron, Dispatch, PR).
    concurrency:
      group: renovate-${{ matrix.owner }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        # Bei manuellem Start mit 'repository' nur der Job des Owners dieses
        # Repositories; die anderen Owner-Jobs werden uebersprungen.
        if: ${{ inputs.repository == '' || startsWith(inputs.repository, format('{0}/', matrix.owner)) }}
        uses: actions/create-github-app-token@v3
        with:
          private-key: ${{ secrets.private_key }}
          # 'app-id' ist deprecated. GitHub akzeptiert im JWT-Issuer sowohl die
          # App ID als auch die Client ID, deshalb bleibt das bestehende Secret
          # hier stehen; es ist kein neues Secret noetig.
          client-id: ${{ secrets.app_id }}
          owner: ${{ matrix.owner }}

      - name: Checkout
        if: ${{ steps.get_token.outcome == 'success' }}
        uses: actions/checkout@v7.0.1

      - name: Self-hosted Renovate
        if: ${{ steps.get_token.outcome == 'success' }}
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: config.js
          token: '${{ steps.get_token.outputs.token }}'
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL)$"
        env:
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' || '' }}
          # Bei manuellem Start mit 'repository' wird statt Autodiscovery nur
          # dieses eine Repository verarbeitet. Leere Werte ignoriert Renovate,
          # dann gilt weiter config.js (autodiscover: true).
          RENOVATE_AUTODISCOVER: ${{ inputs.repository != '' && 'false' || '' }}
          RENOVATE_REPOSITORIES: ${{ inputs.repository }}
